<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>习惯养成规划板</title>
  <!-- 相对路径引用样式（T4：file:// 下不能用 / 开头） -->
  <link rel="stylesheet" href="style.css">
  <!-- Day 18 加餐：主题层（背景插画 + 暖色调 + 音乐开关样式）。
       必须排在 style.css **后面** —— 它靠覆盖 CSS 变量生效 -->
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="app">

    <!-- ============ 顶部概览：今天的日期 + 今天已完成几件 ============ -->
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="today-title">今天</h1>
        <span class="today-date" id="today-date">—</span>
        <!-- Day 17：这份数据是从哪来的（本机 / 云端数据库）。字和显隐都由 cloud.js 填 -->
        <span class="data-source" id="data-source" hidden></span>
      </div>
      <div class="topbar-right">
        <span>今天已完成 <strong id="today-count">0 / 0</strong> 件</span>
        <!-- Day 13：通往看板的入口。今日页 ↔ 看板是**跨文件**跳转，和看板内部的 # 切换是两回事 -->
        <a class="nav-out" href="dashboard.html">看板 ↗</a>
        <!-- Day 18 加餐：页面音乐开关。先用 hidden 藏起来 —— theme.js 确认素材在才显示；
             素材不在（比如公网那份不带音乐）就一直藏着，页面上不留多余的字 -->
        <button type="button" class="music-toggle" id="music-toggle" hidden
                aria-pressed="false" title="点一下放音乐"><span class="music-icon" aria-hidden="true">♪</span><span>音乐</span></button>
      </div>
    </header>

    <!-- ============ 成长物（F6，PRD v1.3）：和看板共用同一株 ============ -->
    <!-- 每一格 = 一片叶子；攒满 7 格开一朵花，花进「花架」。规则见 PRD 第 4 节 F6 -->
    <div class="growth" id="growth" hidden>
      <span class="growth-leaves" id="growth-leaves"></span>
      <span class="growth-text" id="growth-text"></span>
      <span class="growth-shelf" id="growth-shelf"></span>
    </div>

    <!-- ============ 习惯区 ============ -->
    <section class="panel" id="habit-panel">
      <div class="panel-head">
        <h2 class="panel-title">今天的习惯</h2>
        <button type="button" class="btn btn-ghost" id="btn-new-habit">＋ 新建习惯</button>
      </div>
      <div class="panel-body">
        <ul class="list" id="habit-list"></ul>
        <div class="empty" id="habit-empty" hidden>
          <p class="empty-text">还没有习惯，先加一个试试。</p>
          <button type="button" class="btn btn-soft" id="btn-example-habit">
            加一个示例：每天喝够 8 杯水
          </button>
        </div>
      </div>
    </section>

    <!-- ============ 待办区 ============ -->
    <section class="panel" id="todo-panel">
      <div class="panel-head">
        <h2 class="panel-title">今天的待办</h2>
      </div>
      <div class="panel-body">
        <ul class="list" id="todo-list"></ul>
        <div class="empty" id="todo-empty" hidden>
          <p class="empty-text">还没有待办。想到什么，写在下面那一行就行。</p>
        </div>
      </div>
    </section>

    <!-- ============ 底部常驻输入框：一句话加待办 ============ -->
    <form class="addbar" id="todo-form" autocomplete="off">
      <input
        type="text"
        id="todo-input"
        class="addbar-input"
        placeholder="记一件事，按回车就加进今天的待办"
        maxlength="120"
        aria-label="新增待办">
      <button type="submit" class="btn btn-primary" id="todo-add">加</button>
    </form>

  </div>

  <!-- ================= 弹层①：习惯详情 ================= -->
  <div class="mask" id="detail-mask" hidden>
    <div class="dialog dialog-wide" role="dialog" aria-modal="true" aria-labelledby="detail-name">
      <button type="button" class="dialog-back" id="detail-back">← 返回</button>
      <h3 class="dialog-title" id="detail-name">习惯</h3>

      <div class="detail-strength">
        <div class="strength-line">
          <span class="strength-label">本周强度</span>
          <strong class="strength-value" id="detail-strength">—</strong>
        </div>
        <div class="bar"><div class="bar-fill" id="detail-bar" style="width:0%"></div></div>
      </div>

      <p class="detail-label">最近 28 天（点过去的格子可以补勾）</p>
      <div class="grid28" id="detail-grid"></div>
      <div class="legend">
        <span class="legend-item"><i class="dot dot-done"></i>已完成</span>
        <span class="legend-item"><i class="dot dot-miss"></i>没做</span>
        <span class="legend-item"><i class="dot dot-future"></i>还没到</span>
      </div>

      <div class="dialog-actions">
        <button type="button" class="btn btn-soft" id="detail-edit">编辑</button>
        <button type="button" class="btn btn-danger-soft" id="detail-delete">删除</button>
      </div>
    </div>
  </div>

  <!-- ================= 弹层②：新建 / 编辑习惯 ================= -->
  <div class="mask" id="habit-mask" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="habit-form-title">
      <h3 class="dialog-title" id="habit-form-title">新建习惯</h3>

      <label class="field">
        <span class="field-label">名称</span>
        <input type="text" id="habit-name" placeholder="比如：早睡" maxlength="30" autocomplete="off">
      </label>

      <label class="field">
        <span class="field-label">频率</span>
        <select id="habit-freq">
          <option value="daily">每天</option>
          <option value="weekly">每周 N 次</option>
        </select>
      </label>

      <label class="field" id="freq-count-field" hidden>
        <span class="field-label">每周几次</span>
        <input type="number" id="habit-freq-count" min="1" max="7" value="3">
      </label>

      <p class="form-error" id="habit-form-error" hidden></p>

      <div class="dialog-actions">
        <button type="button" class="btn btn-soft" id="habit-cancel">取消</button>
        <button type="button" class="btn btn-primary" id="habit-save">保存</button>
      </div>
    </div>
  </div>

  <!-- ================= 弹层③：删除二次确认（习惯 / 待办共用） ================= -->
  <div class="mask" id="confirm-mask" hidden>
    <div class="dialog dialog-small" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h3 class="dialog-title" id="confirm-title">删除这个习惯？</h3>
      <!-- Day 14：加了 id —— 待办删除也走这个弹层，标题和正文由 JS 按类型换（AC-15） -->
      <p class="dialog-text" id="confirm-text">删掉之后，它的完成记录也会一起没了，而且找不回来。</p>
      <div class="dialog-actions">
        <button type="button" class="btn btn-soft" id="confirm-cancel">取消</button>
        <button type="button" class="btn btn-danger" id="confirm-ok">删除</button>
      </div>
    </div>
  </div>

  <!-- 普通 script 引入（T2：不用模块写法，file:// 下模块会被跨域拦） -->
  <!-- Day 17：cloud.js 是「读云端」的接入层，必须在 app.js 之前引入（app.js 启动后要用它） -->
  <script src="cloud.js"></script>
  <script src="app.js"></script>
  <!-- Day 18 加餐：环境层（页面音乐开关）。放最后 —— 它要等按钮已经出现在 DOM 里 -->
  <script src="theme.js"></script>
</body>
</html>
