<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成长物 · 可玩原型（Day 16）</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --line: #e5e4e0;
    --line-soft: #efeeea;
    --text: #2c2c2a;
    --muted: #6b6a66;
    --faint: #a8a7a2;
    --accent: #185fa5;
    --accent-soft: #e6f1fb;
    --done: #3b6d11;
    --done-soft: #eaf3de;
    --cell-off: #e8e7e3;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    padding: 28px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  .wrap { max-width: 460px; margin: 0 auto; }
  .notice {
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 12.5px;
    margin-bottom: 16px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 20px 18px;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
  .sub { margin: 0; color: var(--muted); font-size: 13px; min-height: 21px; }
  .stage { display: flex; justify-content: center; padding: 6px 0 2px; }
  .shelf {
    display: flex; align-items: center; gap: 10px;
    border-top: 1px solid var(--line-soft);
    margin-top: 6px; padding-top: 12px;
    font-size: 12.5px; color: var(--muted);
  }
  .shelf-label { color: var(--faint); flex: none; }
  .pips { display: flex; gap: 4px; align-items: center; }
  .pip { width: 11px; height: 11px; border-radius: 50%; }
  .shelf-count { color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .btn {
    font-family: inherit; font-size: 13.5px;
    border-radius: 10px; padding: 9px 16px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    cursor: pointer;
  }
  .btn.primary {
    background: var(--done); border-color: var(--done); color: #fff;
    font-weight: 500;
  }
  .btn.primary:disabled {
    background: var(--cell-off); border-color: var(--cell-off);
    color: var(--faint); cursor: default;
  }
  .btn.ghost { color: var(--muted); font-size: 12.5px; padding: 9px 13px; }
  .btn:hover:not(:disabled) { border-color: var(--faint); }
  .btn.primary:hover:not(:disabled) { opacity: .92; }
  .hint { font-size: 12px; color: var(--faint); margin: 12px 2px 0; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">

  <div class="notice">
    这是<b>可玩原型</b>，不是正式页面 —— 用来试手感。它独立于现有的今日页和看板，等你点头之后再谈接不接进去。
  </div>

  <div class="card">
    <h1>你的小苗</h1>
    <p class="sub" id="status">正在读数据…</p>
    <div class="stage" id="stage"></div>
    <div class="shelf">
      <span class="shelf-label">花架</span>
      <span class="pips" id="pips"></span>
      <span class="shelf-count" id="shelfCount">还没养开过花</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn primary" id="feed">喂它一口（今天）</button>
    <button class="btn ghost" id="demo">演示：再长一格</button>
    <button class="btn ghost" id="reset">从土里重新开始</button>
  </div>

  <p class="hint" id="hint"></p>

</div>

<script>
(function () {
  var KEY = 'growth-demo/v1';
  var PETAL_COLORS = ['#d4537e', '#ef9f27', '#7f77dd', '#d85a30'];
  var STEP = 23;          // 每一格的高度（px）
  var BASE_Y = 232;       // 茎的底部
  var MAX = 7;            // 一轮几格

  function todayStr() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || typeof o !== 'object') return null;
      return {
        cells: Math.max(0, Math.min(MAX, o.cells | 0)),
        fedDate: typeof o.fedDate === 'string' ? o.fedDate : null,
        flower: typeof o.flower === 'string' ? o.flower : null,
        flowers: Array.isArray(o.flowers) ? o.flowers : []
      };
    } catch (e) { return null; }
  }

  function save(s) {
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  }

  var state = load() || { cells: 0, fedDate: null, flower: null, flowers: [] };

  /* ---------------------------------------------------------------- 画小苗 */

  function petalGroup(cx, cy, color) {
    var out = '';
    for (var k = 0; k < 5; k++) {
      var a = (Math.PI * 2 / 5) * k - Math.PI / 2;
      var px = (cx + Math.cos(a) * 11).toFixed(1);
      var py = (cy + Math.sin(a) * 11).toFixed(1);
      out += '<circle cx="' + px + '" cy="' + py + '" r="8" fill="' + color + '"/>';
    }
    out += '<circle cx="' + cx + '" cy="' + cy + '" r="6" fill="#faeeda"/>';
    return out;
  }

  function drawSprout() {
    var p = [];

    // 花盆
    p.push('<path d="M72 232 L168 232 L156 262 L84 262 Z" fill="#c9b8a8"/>');
    p.push('<rect x="66" y="224" width="108" height="9" rx="4" fill="#b8a595"/>');

    // 还没长到的部分：一条很淡的虚线茎（不是「缺了什么」，是「还能长到这里」—— 设计原则 1）
    if (state.cells < MAX) {
      var fromY = BASE_Y - state.cells * STEP;
      var toY = BASE_Y - MAX * STEP;
      p.push('<path d="M120 ' + fromY + ' L120 ' + toY +
             '" stroke="#e8e7e3" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 7" fill="none"/>');
    }

    // 茎
    if (state.cells > 0) {
      var top = BASE_Y - state.cells * STEP;
      p.push('<path d="M120 ' + BASE_Y + ' L120 ' + top + '" stroke="#97c459" stroke-width="4" stroke-linecap="round" fill="none"/>');
    }

    // 叶子
    for (var j = 1; j <= state.cells; j++) {
      var ly = BASE_Y - j * STEP;
      var right = (j % 2 === 1);
      var lx = right ? 142 : 98;
      var rot = right ? -20 : 20;
      var fill = right ? '#639922' : '#97c459';
      p.push('<ellipse cx="' + lx + '" cy="' + ly + '" rx="15" ry="8" fill="' + fill +
             '" transform="rotate(' + rot + ' ' + lx + ' ' + ly + ')"/>');
    }

    // 开出来的花
    if (state.cells === MAX && state.flower) {
      p.push(petalGroup(120, BASE_Y - MAX * STEP - 18, state.flower));
    }

    document.getElementById('stage').innerHTML =
      '<svg viewBox="0 0 240 280" width="240" height="280" role="img" aria-label="你的小苗">' + p.join('') + '</svg>';
  }

  /* ---------------------------------------------------------------- 画花架 */

  function drawShelf() {
    var pips = document.getElementById('pips');
    var count = document.getElementById('shelfCount');
    pips.innerHTML = '';
    state.flowers.forEach(function (c) {
      var d = document.createElement('span');
      d.className = 'pip';
      d.style.background = c;
      pips.appendChild(d);
    });
    count.textContent = state.flowers.length
      ? '你养开过 ' + state.flowers.length + ' 朵花'
      : '还没养开过花';
  }

  /* ---------------------------------------------------------------- 画按钮 */

  function drawTexts() {
    var status = document.getElementById('status');
    var feed = document.getElementById('feed');
    var hint = document.getElementById('hint');
    var fedToday = state.fedDate === todayStr();

    if (state.cells === MAX && state.flower) {
      status.textContent = '这一轮长满了 —— 顶端开了一朵花';
    } else if (state.cells === 0) {
      status.textContent = '还没喂过 —— 它在土里等着';
    } else {
      status.textContent = '这一轮喂了 ' + state.cells + ' 口，长到第 ' + state.cells + ' 格';
    }

    if (state.cells === MAX && state.flower) {
      feed.textContent = '收下这朵花，开始新的一轮';
      feed.disabled = false;
    } else if (fedToday) {
      feed.textContent = '今天喂过了';
      feed.disabled = true;
    } else {
      feed.textContent = '喂它一口（今天）';
      feed.disabled = false;
    }

    hint.textContent = fedToday
      ? '今天它自己待着也挺好 —— 明天再来喂一口。一天最多长一格，这一轮攒够 7 格就开一朵花。'
      : '正式规则是一天最多长一格。这里为了让你看够效果，「演示：再长一格」可以连着点。';
  }

  function render() {
    drawSprout();
    drawShelf();
    drawTexts();
  }

  /* ---------------------------------------------------------------- 动作 */

  function feedToday() {
    if (state.cells === MAX && state.flower) {
      // 收花，进下一轮
      state.flowers.push(state.flower);
      state.cells = 0;
      state.flower = null;
      state.fedDate = null;
    } else if (state.cells < MAX) {
      state.cells++;
      state.fedDate = todayStr();
      if (state.cells === MAX) {
        state.flower = PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)];
      }
    }
    save(state);
    render();
  }

  function demoGrow() {
    if (state.cells === MAX && state.flower) {
      state.flowers.push(state.flower);
      state.cells = 0;
      state.flower = null;
    } else if (state.cells < MAX) {
      state.cells++;
      if (state.cells === MAX) {
        state.flower = PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)];
      }
    }
    save(state);
    render();
  }

  function resetAll() {
    state = { cells: 0, fedDate: null, flower: null, flowers: [] };
    save(state);
    render();
  }

  document.getElementById('feed').addEventListener('click', feedToday);
  document.getElementById('demo').addEventListener('click', demoGrow);
  document.getElementById('reset').addEventListener('click', resetAll);

  render();
})();
</script>
</body>
</html>
